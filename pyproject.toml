[project]
name = "nblm"
version = "0.1.0"
description = "Self-built uploader for personal Google NotebookLM (CLI + MCP server)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "mcp[cli]>=1.2",
]

[project.scripts]
nblm = "nblm.cli:main"
nblm-mcp = "nblm.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nblm"]
